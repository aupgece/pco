<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air University – Grade Report</title>
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background:#edf2f7; font-size:13px; color:#000; }

/* ── TOP NAV ── */
.top-bar {
  background: linear-gradient(135deg,#0b3d91,#002060);
  color: #fff;
  padding: 10px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
}
.top-bar-title { font-size: .95rem; font-weight: 700; letter-spacing: .4px; }
.top-bar-sub   { font-size: .72rem; opacity: .72; margin-top: 2px; }
.btn-print-top {
  background: transparent;
  border: 1.5px solid rgba(255,255,255,.55);
  color: #fff; padding: 6px 16px; border-radius: 6px;
  cursor: pointer; font-size: .82rem; font-family: Arial, sans-serif;
  transition: .15s;
}
.btn-print-top:hover { background: rgba(255,255,255,.15); border-color: #fff; }

/* ── SEARCH PANEL ── */
.search-panel {
  background: #fff; border-bottom: 1px solid #c0cad8;
  padding: 14px 28px; position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
}
.search-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search-wrap { position: relative; flex: 1; min-width: 220px; }
.search-wrap input {
  width: 100%; border: 1.5px solid #b0bfd0; border-radius: 7px;
  padding: 8px 10px 8px 34px; font-size: .88rem;
  font-family: Arial, sans-serif; outline: none; background: #f7faff;
}
.search-wrap input:focus { border-color: #002060; background: #fff; }
.si { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #888; pointer-events: none; }
.dropdown {
  position: absolute; top: calc(100% + 3px); left: 0; right: 0;
  background: #fff; border: 1.5px solid #002060; border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0,0,0,.13); max-height: 260px;
  overflow-y: auto; z-index: 300; display: none;
}
.dropdown.show { display: block; }
.di { padding: 9px 14px; cursor: pointer; border-bottom: 1px solid #edf0f7; display: flex; justify-content: space-between; font-size: .86rem; }
.di:last-child { border-bottom: none; }
.di:hover, .di.active { background: #e8f0fe; }
.di-n { font-weight: 600; }
.di-r { color: #666; font-size: .78rem; }
.filter-sel {
  border: 1.5px solid #b0bfd0; border-radius: 7px; padding: 8px 10px;
  font-size: .85rem; font-family: Arial, sans-serif;
  background: #f7faff; cursor: pointer; outline: none;
}
.filter-sel:focus { border-color: #002060; }
.btn-clear {
  background: #002060; color: #fff; border: none; border-radius: 7px;
  padding: 8px 16px; cursor: pointer; font-size: .85rem;
  font-family: Arial, sans-serif; transition: .15s;
}
.btn-clear:hover { background: #1a4da0; }

/* ── MAIN AREA ── */
.main { max-width: 820px; margin: 28px auto; padding: 0 16px; }

.landing { text-align: center; padding: 70px 20px; color: #666; }
.landing-icon { font-size: 3rem; margin-bottom: 14px; opacity: .28; }
.landing h3 { font-size: 1.15rem; color: #002060; margin-bottom: 6px; }
.landing p { font-size: .88rem; line-height: 1.6; }

/* ══════════════════════════════════════════════════
   GRADE REPORT — mirrors the official PDF exactly
══════════════════════════════════════════════════ */
.report-page {
  background: #fff;
  border: 1px solid #bbb;
  padding: 20px 28px 22px;
  margin-bottom: 28px;
  box-shadow: 0 3px 14px rgba(0,0,0,.12);
  font-family: Arial, sans-serif;
  font-size: 11px;
  color: #000;
  line-height: 1.35;
}

/* ── Report header ── */
.rpt-header {
  position: relative;
  text-align: center;
  padding-bottom: 6px;
  border-bottom: 2px solid #000;
  margin-bottom: 5px;
}
.rpt-logo {
  position: absolute; left: 0; top: 0;
  width: 72px; height: 72px; object-fit: contain;
}
.rpt-uni-name {
  font-family: 'Times New Roman', Times, serif;
  font-size: 22px; font-weight: 900; letter-spacing: 1.5px;
  margin-top: 2px;
}
.rpt-tagline {
  /* horizontal rule under AIR UNIVERSITY */
  border-top: 1.5px solid #000;
  margin: 3px 60px 4px;
}
.rpt-doc-title  { font-size: 13px; font-weight: 700; }
.rpt-program    { font-size: 12px; font-weight: 700; text-decoration: underline; margin-top: 1px; }

/* printed-on sits right-aligned below header rule */
.rpt-printed-on { text-align: right; font-size: 10px; margin: 3px 0 4px; }

/* ── Student info ── */
.rpt-info { font-size: 11px; margin-bottom: 7px; }
.rpt-info table { border-collapse: collapse; }
.rpt-info td { padding: 1px 4px 1px 0; vertical-align: top; }
.rpt-info td.lbl { font-weight: 700; white-space: nowrap; padding-right: 8px; }

/* ── Semester heading row ── */
.sem-heading {
  display: flex;
  align-items: baseline;
  font-size: 11px;
  font-weight: 700;
  margin-top: 6px;
  margin-bottom: 0;
}
.sh-season { font-size: 11px; font-weight: 900; }
.sh-dates  { font-weight: 400; font-size: 10.5px; margin-left: 18px; }
.sh-label  { margin-left: auto; font-weight: 700; font-size: 11px; }

/* ── Course table ── */
table.ctbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 10.5px;
  margin-top: 1px;
}
table.ctbl thead tr { background: #000; color: #fff; }
table.ctbl thead th {
  padding: 3px 6px;
  text-align: left;
  font-weight: 600;
  font-size: 10px;
  border: 1px solid #000;
}
table.ctbl thead th.c { text-align: center; }
table.ctbl tbody td {
  padding: 2px 6px;
  border: 1px solid #bbb;
  vertical-align: middle;
}
table.ctbl tbody td.c { text-align: center; }
table.ctbl tbody tr:nth-child(even) { background: #f3f3f3; }

/* ── Semester summary bar ── */
.sem-bar {
  background: #dcdcdc;
  border: 1px solid #bbb;
  border-top: none;
  padding: 2px 7px;
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  gap: 0;
}
.sem-bar span { margin-right: 18px; }
.sem-bar .sbar-right { margin-left: auto; margin-right: 0; }

/* ── Credit / CGPA summary (plain text, 2-column layout like PDF) ── */
.rpt-summary {
  margin-top: 10px;
  display: flex;
  align-items: flex-start;
  font-size: 10.5px;
}
.rpt-sum-left {
  flex: 1;
}
.rpt-sum-left .sum-row {
  display: flex;
  margin-bottom: 1px;
}
.rpt-sum-left .sum-label {
  /* fixed width so numbers align */
  min-width: 260px;
}
.rpt-sum-left .sum-value {
  font-weight: 400;
}
.rpt-sum-right {
  text-align: right;
  font-size: 10.5px;
  padding-left: 16px;
  white-space: nowrap;
}
.rpt-sum-right .cgpa-line  { font-weight: 700; }
.rpt-sum-right .stand-line { font-weight: 400; }

/* ── Degree status + disclaimer ── */
.rpt-degree-row {
  margin-top: 10px;
  font-size: 10.5px;
  display: flex;
  gap: 0;
}
.rpt-degree-row .dl { font-weight: 700; min-width: 120px; }
.rpt-degree-row .dv { margin-left: 60px; }

.rpt-disclaimer {
  margin-top: 6px;
  font-size: 10px;
  color: #222;
}

/* ── Page footer ── */
.rpt-footer {
  margin-top: 20px;
  border-top: 1px solid #aaa;
  padding-top: 4px;
  display: flex;
  justify-content: space-between;
  font-size: 10px;
}
.rpt-footer-addr {
  border-top: 1px solid #aaa;
  margin-top: 4px;
  padding-top: 4px;
  text-align: center;
  font-size: 10px;
}

.no-results { text-align: center; padding: 40px; color: #666; font-size: .9rem; }

/* ══ PRINT ══ */
@media print {
  .top-bar, .search-panel { display: none !important; }
  body { background: #fff; }
  .main { max-width: 100%; margin: 0; padding: 0; }
  .report-page {
    border: none; box-shadow: none;
    padding: 14px 20px 18px;
    margin: 0;
    page-break-after: always;
  }
  .report-page:last-child { page-break-after: auto; }
}
@media (max-width: 600px) {
  .rpt-logo { width: 52px; height: 52px; }
  .rpt-uni-name { font-size: 16px; }
  .report-page { padding: 12px 10px; }
  .search-panel { padding: 12px 12px; }
}

let filteredStudents = [], activeIndex = -1;

function handleSearch() {
  const q    = document.getElementById('searchInput').value.trim().toLowerCase();
  const semF = document.getElementById('semFilter').value;
  const stF  = document.getElementById('standingFilter').value.toLowerCase();
  const list = document.getElementById('dropdownList');
  if (!q && !semF && !stF) { list.classList.remove('show'); showLanding(); return; }
  filteredStudents = STUDENTS.filter(s => {
    const mQ = !q   || (s.name||'').toLowerCase().includes(q) || (s.rollNo||'').toLowerCase().includes(q) || (s.cnic||'').includes(q);
    const mS = !semF || s.semesters.some(x => x.label === semF);
    const mT = !stF  || (s.academicStanding||'').toLowerCase().includes(stF);
    return mQ && mS && mT;
  });
  if (!filteredStudents.length) {
    list.innerHTML = '<div class="di"><span class="di-n" style="color:#888">No students found</span></div>';
    list.classList.add('show'); showReport([]); return;
  }
  activeIndex = -1;
  list.innerHTML = filteredStudents.slice(0,40).map((s,i) =>
    `<div class="di" data-idx="${i}" onclick="selectStudent(${i})">
       <span class="di-n">${s.name}</span><span class="di-r">Roll: ${s.rollNo}</span>
     </div>`).join('');
  list.classList.add('show');
  if (filteredStudents.length === 1) showReport(filteredStudents);
}

function handleKeydown(e) {
  const list  = document.getElementById('dropdownList');
  const items = list.querySelectorAll('.di[data-idx]');
  if (!list.classList.contains('show') || !items.length) return;
  if (e.key==='ArrowDown') { activeIndex=Math.min(activeIndex+1,items.length-1); updA(items); e.preventDefault(); }
  else if (e.key==='ArrowUp') { activeIndex=Math.max(activeIndex-1,0); updA(items); e.preventDefault(); }
  else if (e.key==='Enter' && activeIndex>=0) { selectStudent(activeIndex); e.preventDefault(); }
  else if (e.key==='Escape') list.classList.remove('show');
}
function updA(items) {
  items.forEach((el,i) => el.classList.toggle('active', i===activeIndex));
  if (activeIndex>=0) items[activeIndex].scrollIntoView({block:'nearest'});
}
function selectStudent(idx) {
  const s = filteredStudents[idx]; if (!s) return;
  document.getElementById('searchInput').value = s.name;
  document.getElementById('dropdownList').classList.remove('show');
  showReport([s]);
}
function applyFilters() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) {
    const semF = document.getElementById('semFilter').value;
    const stF  = document.getElementById('standingFilter').value.toLowerCase();
    if (semF || stF) {
      filteredStudents = STUDENTS.filter(s => {
        const mS = !semF || s.semesters.some(x => x.label===semF);
        const mT = !stF  || (s.academicStanding||'').toLowerCase().includes(stF);
        return mS && mT;
      });
      showReport(filteredStudents);
      document.getElementById('dropdownList').classList.remove('show');
      return;
    }
  }
  handleSearch();
}
function clearAll() {
  document.getElementById('searchInput').value = '';
  document.getElementById('semFilter').value   = '';
  document.getElementById('standingFilter').value = '';
  document.getElementById('dropdownList').classList.remove('show');
  showLanding();
}
function showLanding() {
  document.getElementById('landing').style.display = 'block';
  document.getElementById('reportContainer').innerHTML = '';
}
function showReport(students) {
  document.getElementById('landing').style.display = 'none';
  const c = document.getElementById('reportContainer');
  if (!students.length) { c.innerHTML='<div class="no-results">No students match.</div>'; return; }
  c.innerHTML = students.map(renderReport).join('');
}

/* ══════════════════════════════════════
   Single renderReport — used for ALL students
══════════════════════════════════════ */
function renderReport(s) {
  const today = 'June 1, 2026';

  let semsHTML = '';
  s.semesters.forEach(sem => {
    if (!sem.courses || !sem.courses.length) return;
    const rows = sem.courses.map(c =>
      `<tr>
         <td style="white-space:nowrap">${c.code}</td>
         <td>${c.name}</td>
         <td class="c">${c.crHrs}</td>
         <td class="c">${c.grade}</td>
         <td class="c">${(c.gp !== undefined && c.gp !== '') ? c.gp : ''}</td>
       </tr>`).join('');

    semsHTML += `
      <div class="sem-heading">
        <span class="sh-season">${sem.title}</span>
        <span class="sh-dates">${sem.dates}</span>
        <span class="sh-label">${sem.label}</span>
      </div>
      <table class="ctbl">
        <thead><tr>
          <th style="width:68px">Code</th>
          <th>Course</th>
          <th class="c" style="width:52px">Cr. Hrs</th>
          <th class="c" style="width:48px">Grade</th>
          <th class="c" style="width:48px">GP</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="sem-bar">
        <span>SGPA: ${sem.sgpa||'–'}</span>
        <span>CGPA: ${sem.cgpa||'–'}</span>
        ${sem.standing ? `<span>${sem.standing}</span>` : ''}
        <span class="sbar-right">Cr.hrs.: ${sem.crHrs||'–'}</span>
      </div>`;
  });

  const summaryHTML = `
    <div class="rpt-summary">
      <div class="rpt-sum-left">
        <div class="sum-row">
          <span class="sum-label">Credit Hrs. - Successfully Completed</span>
          <span class="sum-value">&nbsp;&nbsp;&nbsp;${s.finalCrHrs||'–'}</span>
        </div>
        <div class="sum-row">
          <span class="sum-label">Total Credit Hours</span>
          <span class="sum-value">&nbsp;&nbsp;&nbsp;${s.finalCrHrs||'–'}</span>
        </div>
      </div>
      <div class="rpt-sum-right">
        <div class="cgpa-line">CGPA:&nbsp; ${s.finalCGPA||'–'}</div>
        <div class="stand-line">Academic Standing: ${s.academicStanding||'–'}</div>
      </div>
    </div>`;

  return `
    <div class="report-page">

      <div class="rpt-header">
        <img class="rpt-logo" src="data:image/png;base64,${LOGO_B64}" alt="AU Logo">
        <div class="rpt-uni-name">AIR UNIVERSITY</div>
        <div class="rpt-tagline"></div>
        <div class="rpt-doc-title">Grade Report</div>
        <div class="rpt-program">${s.program||'Department of Electrical &amp; Computer Engineering'}</div>
      </div>

      <div class="rpt-printed-on">Printed on: ${today}</div>

      <div class="rpt-info">
        <table>
          <tr><td class="lbl">Roll No:</td><td>${s.rollNo}</td></tr>
          <tr><td class="lbl">Name:</td><td>${s.name}&nbsp;&nbsp;<span style="font-weight:400">(CNIC ${s.cnic})</span></td></tr>
          <tr><td class="lbl">Father Name:</td><td>${s.fatherName||'–'}</td></tr>
          <tr><td class="lbl">Date of Birth:</td><td>${s.dob||'–'}</td></tr>
        </table>
      </div>

      ${semsHTML}

      ${summaryHTML}

      <div class="rpt-degree-row" style="margin-top:12px">
        <span class="dl">Degree Status:</span>
        <span class="dv">${s.degreeStatus||'–'}</span>
      </div>

      <div class="rpt-disclaimer">
        * This is a computer generated report which is not valid for academic evaluation until authenticated by the Registrar.
      </div>

      <div class="rpt-footer">
        <span>Automation Department</span>
        <span><b>Printed on: ${today}</b></span>
      </div>
      <div class="rpt-footer-addr">
        Sector E-9, Islamabad. Tel: 051-111-247-864 Fax: 051-9260158<br>
        Email: registration@au.edu.pk
      </div>

    </div>`;
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap'))
    document.getElementById('dropdownList').classList.remove('show');
});
