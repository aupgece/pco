<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Timetable & Availability</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .filter-select {
            @apply block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm;
        }
        .status-free { @apply bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-bold uppercase; }
        .status-occupied { @apply bg-red-100 text-red-800 px-2 py-1 rounded text-xs font-bold uppercase; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">University Timetable & Availability</h1>
        <p class="text-gray-600 mb-8">Search for classes or find free rooms and slots using the filters below.</p>
        
        <!-- Filters -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Status (Free/Occupied)</label>
                <select id="filter-status" class="filter-select border-2 border-indigo-300" onchange="applyFilters()">
                    <option value="">All Statuses</option>
                    <option value="Free">FREE (Available)</option>
                    <option value="Occupied">Occupied</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Day</label>
                <select id="filter-day" class="filter-select" onchange="applyFilters()">
                    <option value="">All Days</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Time Slot</label>
                <select id="filter-time" class="filter-select" onchange="applyFilters()">
                    <option value="">All Times</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Room</label>
                <select id="filter-room" class="filter-select" onchange="applyFilters()">
                    <option value="">All Rooms</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
                <select id="filter-dept" class="filter-select" onchange="applyFilters()">
                    <option value="">All Departments</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Teacher</label>
                <select id="filter-teacher" class="filter-select" onchange="applyFilters()">
                    <option value="">All Teachers</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                <select id="filter-subject" class="filter-select" onchange="applyFilters()">
                    <option value="">All Subjects</option>
                </select>
            </div>
            <div class="flex items-end">
                <button onclick="resetFilters()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-md transition duration-150">
                    Clear All Filters
                </button>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Room</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Day</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Time</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Subject</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Teacher</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Dept</th>
                        </tr>
                    </thead>
                    <tbody id="timetable-body" class="bg-white divide-y divide-gray-200">
                        <!-- Data rows will be inserted here -->
                    </tbody>
                </table>
            </div>
            <div id="no-results" class="hidden p-8 text-center text-gray-500">
                No matching records found.
            </div>
        </div>
    </div>

        function populateFilters() {
            const fields = {
                'filter-day': 'Day',
                'filter-time': 'Time',
                'filter-room': 'Room',
                'filter-dept': 'Department',
                'filter-teacher': 'Teacher',
                'filter-subject': 'Subject'
            };

            for (const [id, field] of Object.entries(fields)) {
                const select = document.getElementById(id);
                const values = [...new Set(timetableData.map(item => item[field]))].filter(v => v && v !== '-').sort();
                values.forEach(val => {
                    const opt = document.createElement('option');
                    opt.value = val;
                    opt.textContent = val;
                    select.appendChild(opt);
                });
            }
        }

        function renderTable(data) {
            const body = document.getElementById('timetable-body');
            const noResults = document.getElementById('no-results');
            body.innerHTML = '';

            if (data.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                data.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = item.Status === 'Free' ? 'bg-green-50/30 hover:bg-green-50' : 'hover:bg-gray-50';
                    const statusClass = item.Status === 'Free' ? 'status-free' : 'status-occupied';
                    
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap"><span class="${statusClass}">${item.Status}</span></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">${item.Room}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${item.Day}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${item.Time}</td>
                        <td class="px-6 py-4 text-sm text-gray-900">${item.Subject}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${item.Teacher}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${item.Department}</td>
                    `;
                    body.appendChild(row);
                });
            }
        }

        function applyFilters() {
            const statusVal = document.getElementById('filter-status').value;
            const dayVal = document.getElementById('filter-day').value;
            const timeVal = document.getElementById('filter-time').value;
            const roomVal = document.getElementById('filter-room').value;
            const deptVal = document.getElementById('filter-dept').value;
            const teacherVal = document.getElementById('filter-teacher').value;
            const subjectVal = document.getElementById('filter-subject').value;

            const filtered = timetableData.filter(item => {
                return (!statusVal || item.Status === statusVal) &&
                       (!dayVal || item.Day === dayVal) &&
                       (!timeVal || item.Time === timeVal) &&
                       (!roomVal || item.Room === roomVal) &&
                       (!deptVal || item.Department === deptVal) &&
                       (!teacherVal || item.Teacher === teacherVal) &&
                       (!subjectVal || item.Subject === subjectVal);
            });

            renderTable(filtered);
        }

        function resetFilters() {
            const selects = document.querySelectorAll('.filter-select');
            selects.forEach(s => s.value = '');
            renderTable(timetableData);
        }

        window.onload = () => {
            populateFilters();
            renderTable(timetableData);
        };
