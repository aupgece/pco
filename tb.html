<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Schedule & Room Availability</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfaf7; /* Elegant Ivory/Cream background */
            color: #2c3e50;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: #1a2a6c; /* Deep Oxford Blue */
        }
        .academic-card {
            background: white;
            border-top: 3px solid #b8860b; /* Dark Goldenrod accent */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
        }
        .filter-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 0.25rem;
            display: block;
        }
        .filter-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1.5em 1.5em;
            @apply block w-full pl-3 pr-10 py-2 text-sm border-gray-200 rounded-md focus:ring-blue-500 focus:border-blue-500 transition-all;
            border-width: 1px;
        }
        .status-badge {
            @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold tracking-wide;
        }
        .status-free {
            background-color: #e9f5ee;
            color: #2d6a4f;
            border: 1px solid #d8e9e0;
        }
        .status-occupied {
            background-color: #fff1f2;
            color: #9f1239;
            border: 1px solid #ffe4e6;
        }
        .table-header {
            background-color: #1a2a6c; /* Deep Oxford Blue Header */
            color: #ffffff;
        }
        .table-header th {
            color: #e2e8f0 !important;
            font-weight: 500;
        }
        .btn-clear {
            @apply px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 border border-slate-200 rounded-md hover:bg-slate-200 focus:outline-none transition-colors;
        }
        tr:nth-child(even) {
            background-color: #faf9f6;
        }
    </style>
</head>
<body class="min-h-screen py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto">
        <!-- Header Section -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold mb-4">Department of Electrical & Computer Engineering</h1>
            <div class="w-20 h-0.5 bg-amber-600 mx-auto mb-6"></div>
            <p class="text-md text-slate-500 italic max-w-2xl mx-auto font-serif">
                A comprehensive overview of Timetable.
            </p>
        </header>

        <!-- Filters Section -->
        <div class="academic-card rounded-xl p-8 mb-10">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div>
                    <label class="filter-label">Availability</label>
                    <select id="filter-status" class="filter-select" onchange="applyFilters()">
                        <option value="">All Statuses</option>
                        <option value="Free">Available (Free)</option>
                        <option value="Occupied">Occupied</option>
                    </select>
                </div>
                <div>
                    <label class="filter-label">Day of Week</label>
                    <select id="filter-day" class="filter-select" onchange="applyFilters()">
                        <option value="">All Days</option>
                    </select>
                </div>
                <div>
                    <label class="filter-label">Time Slot</label>
                    <select id="filter-time" class="filter-select" onchange="applyFilters()">
                        <option value="">All Times</option>
                    </select>
                </div>
                <div>
                    <label class="filter-label">Location / Room</label>
                    <select id="filter-room" class="filter-select" onchange="applyFilters()">
                        <option value="">All Rooms</option>
                    </select>
                </div>
                <div>
                    <label class="filter-label">Department</label>
                    <select id="filter-dept" class="filter-select" onchange="applyFilters()">
                        <option value="">All Departments</option>
                    </select>
                </div>
                <div>
                    <label class="filter-label">Faculty Member</label>
                    <select id="filter-teacher" class="filter-select" onchange="applyFilters()">
                        <option value="">All Teachers</option>
                    </select>
                </div>
                <div>
                    <label class="filter-label">Course Subject</label>
                    <select id="filter-subject" class="filter-select" onchange="applyFilters()">
                        <option value="">All Subjects</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="resetFilters()" class="btn-clear w-full">
                        Reset All Filters
                    </button>
                </div>
            </div>
        </div>

        <!-- Table Section -->
        <div class="academic-card rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="table-header">
                        <tr>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-widest">Status</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-widest">Room</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-widest">Day</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-widest">Time</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-widest">Subject</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-widest">Instructor</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-widest">Dept.</th>
                        </tr>
                    </thead>
                    <tbody id="timetable-body" class="bg-white divide-y divide-slate-200">
                        <!-- Dynamic content -->
                    </tbody>
                </table>
            </div>
            <div id="no-results" class="hidden py-16 text-center">
                <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>

                <p class="mt-1 text-sm text-slate-500">Try adjusting your filters to find what you're looking for.</p>
            </div>
        </div>
        
        <footer class="mt-12 text-center text-slate-500 text-sm">
            <p>&copy; 2026 University Scheduling System. All rights reserved.</p>
        </footer>
    </div>

        function populateFilters() {
            const fields = {
                'filter-day': 'Day',
                'filter-time': 'Time',
                'filter-room': 'Room',
                'filter-dept': 'Department',
                'filter-teacher': 'Teacher',
                'filter-subject': 'Subject'
            };
            for (const [id, field] of Object.entries(fields)) {
                const select = document.getElementById(id);
                const values = [...new Set(timetableData.map(item => item[field]))].filter(v => v && v !== '-').sort();
                values.forEach(val => {
                    const opt = document.createElement('option');
                    opt.value = val;
                    opt.textContent = val;
                    select.appendChild(opt);
                });
            }
        }

        function renderTable(data) {
            const body = document.getElementById('timetable-body');
            const noResults = document.getElementById('no-results');
            body.innerHTML = '';
            
            if (data.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                data.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-blue-50/50 transition-colors';
                    const statusClass = item.Status === 'Free' ? 'status-free' : 'status-occupied';
                    
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap"><span class="status-badge ${statusClass}">${item.Status}</span></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-slate-900">${item.Room}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">${item.Day}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600 font-medium">${item.Time}</td>
                        <td class="px-6 py-4 text-sm text-slate-900 font-medium">${item.Subject === '-' ? '<span class="text-slate-300">—</span>' : item.Subject}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">${item.Teacher === '-' ? '<span class="text-slate-300">—</span>' : item.Teacher}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500 font-mono">${item.Department === '-' ? '<span class="text-slate-300">—</span>' : item.Department}</td>
                    `;
                    body.appendChild(row);
                });
            }
        }

        function applyFilters() {
            const statusVal = document.getElementById('filter-status').value;
            const dayVal = document.getElementById('filter-day').value;
            const timeVal = document.getElementById('filter-time').value;
            const roomVal = document.getElementById('filter-room').value;
            const deptVal = document.getElementById('filter-dept').value;
            const teacherVal = document.getElementById('filter-teacher').value;
            const subjectVal = document.getElementById('filter-subject').value;

            const filtered = timetableData.filter(item => {
                return (!statusVal || item.Status === statusVal) &&
                       (!dayVal || item.Day === dayVal) &&
                       (!timeVal || item.Time === timeVal) &&
                       (!roomVal || item.Room === roomVal) &&
                       (!deptVal || item.Department === deptVal) &&
                       (!teacherVal || item.Teacher === teacherVal) &&
                       (!subjectVal || item.Subject === subjectVal);
            });
            renderTable(filtered);
        }

        function resetFilters() {
            const selects = document.querySelectorAll('.filter-select');
            selects.forEach(s => s.value = '');
            renderTable(timetableData);
        }

        window.onload = () => {
            populateFilters();
            renderTable(timetableData);
        };
